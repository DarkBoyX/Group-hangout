/* ---- themes: white, white & gray (black & gray is the default above) ---- */
html[data-theme="light"],html[data-theme="soft"]{color-scheme:light;--panel:#f7f7f8;--panel2:#ececef;--line:rgba(0,0,0,.1);--text:#111113;--muted:#5d5d65;--btn:#111113;--btntext:#fff;--bad:#c0392b;--btnbg:linear-gradient(180deg,#2c2c31,#111113);--inp:rgba(0,0,0,.05);--inpf:rgba(0,0,0,.08);--bar:rgba(255,255,255,.9);--bart:rgba(255,255,255,.92);--hov:#efeff1;--hoverb:rgba(0,0,0,.2);--pop:#fff;--card:#fff;--mine:linear-gradient(135deg,#3a3a40,#1d1d21);--minetx:#fff;--who:#6b6b73;--markb:#fff;--logo:linear-gradient(90deg,#111,#8a8a92,#111);--sb:#c9c9d0;--cban:rgba(0,0,0,.06);--badgebg:#111113;--badgetx:#fff;--mn:rgba(0,0,0,.1);--tickb:#b4b4bc;--held:rgba(0,0,0,.3);--badtx:#d12c2c;--shd:rgba(0,0,0,.14);--ring:#333}
html[data-theme="light"]{--bg:#ffffff;--bodybg:#ffffff;--shell:rgba(255,255,255,.7)}
html[data-theme="soft"]{--bg:#eeeef1;--bodybg:linear-gradient(180deg,#f7f7f9,#e4e4e8);--panel:#ffffff;--panel2:#e6e6ea;--shell:rgba(255,255,255,.55);--bar:rgba(255,255,255,.85);--bart:rgba(255,255,255,.88);--hov:#f6f6f8}
html[data-theme="light"] .b.me .tm,html[data-theme="soft"] .b.me .tm{color:rgba(255,255,255,.65)}
html[data-theme="light"] .b.me button,html[data-theme="soft"] .b.me button{background:linear-gradient(180deg,#f4f4f5,#c4c4c9);color:#09090a}
html[data-theme="light"] .b.me .gone,html[data-theme="soft"] .b.me.gone{color:rgba(255,255,255,.7)}
/* call screen, incoming-call banner and update screen stay dark in every theme */
.callui,.ring,.ringfull,.upd,.cpill{--text:#ececee;--muted:#8e8e95;--panel:rgba(30,30,33,.72);--panel2:#26262a;--line:rgba(255,255,255,.09);--btnbg:linear-gradient(180deg,#f4f4f5,#c4c4c9);--btntext:#09090a;--btn:#e4e4e7;--ring:#d4d4d8;color:var(--text)}
/* theme picker + language list */
.themes{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:6px}
.topt{padding:10px 6px;text-align:center;background:var(--panel);color:var(--text);border:2px solid var(--line);border-radius:14px;font-size:13px;font-weight:700;cursor:pointer;box-shadow:none}
.topt.on{border-color:var(--text)}
.topt .sw{display:flex;height:34px;border-radius:9px;overflow:hidden;margin-bottom:8px;border:1px solid rgba(128,128,128,.4)}
.topt .sw i{flex:1}
.item.lang .tick{margin-left:auto}
/* right-to-left languages (Arabic) */
[dir="rtl"] .b.me{border-bottom-right-radius:18px;border-bottom-left-radius:5px;transform-origin:bottom left}
[dir="rtl"] .b.them{border-bottom-left-radius:18px;border-bottom-right-radius:5px;transform-origin:bottom right}
[dir="rtl"] .tm,[dir="rtl"] .kv .v,[dir="rtl"] .cnt{text-align:left}
[dir="rtl"] .pill{margin-left:10px;margin-right:auto}
[dir="rtl"] .badge{right:auto;left:-5px}
[dir="rtl"] .item>.i:last-child svg{transform:scaleX(-1)}
@media(min-width:760px){[dir="rtl"] .side{border-right:0;border-left:1px solid var(--line)}[dir="rtl"] .ttl{text-align:right}}

.bnr{height:110px;border-radius:14px;background-color:var(--panel2);background-size:cover;background-position:center}
.bnr.empty{height:70px;border:1px dashed var(--line);background:none}
.acct .bnr{margin-bottom:0}
.bnr+.av{margin-top:-48px;position:relative}
.acct .bnr+.av{box-shadow:0 0 0 4px var(--bg)}
.pcard .bnr{margin:-22px -22px 0;border-radius:22px 22px 0 0}
.pcard .bnr+.av{box-shadow:0 0 0 4px var(--card)}

/* ===== v2: layout polish, animated auth, splash, themed buttons ===== */
.nav{padding-bottom:calc(8px + env(safe-area-inset-bottom,0px))}
.send{padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
.top{padding:12px 16px}
.item{border-radius:18px}
.nav button{border-radius:14px}
.body .lbl{margin:20px 2px 8px;font-size:12px;letter-spacing:1px;text-transform:uppercase}
.themes{gap:10px}
.bnr,.bnr.empty{border-radius:16px}
.setav{padding:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px}
.acts{flex-wrap:wrap}
.savebar{position:sticky;bottom:-14px;z-index:5;margin:14px -16px -14px;padding:12px 16px calc(env(safe-area-inset-bottom,0px) + 12px);background:var(--bart);-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px);border-top:1px solid var(--line)}
.savebar .muted{margin:0 0 8px!important;min-height:18px!important;text-align:center}
html[data-theme="light"]{--btnbg:linear-gradient(180deg,#f6f6f8,#e4e4e9);--btntext:#111113}
html[data-theme="soft"]{--btnbg:linear-gradient(180deg,#e4e4e9,#cfcfd6);--btntext:#111113}
html[data-theme="light"] button.full,html[data-theme="soft"] button.full{box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
html[data-theme="light"] .item.sel .tick,html[data-theme="soft"] .item.sel .tick,html[data-theme="light"] .mn.me,html[data-theme="soft"] .mn.me{color:#fff}
.orbs{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orbs i{position:absolute;width:52vmax;height:52vmax;border-radius:50%;background:radial-gradient(circle,rgba(150,150,165,.38),transparent 68%);will-change:transform;animation:drift 14s ease-in-out infinite alternate}
.orbs i:nth-child(1){left:-20vmax;top:-16vmax}
.orbs i:nth-child(2){right:-24vmax;top:28%;animation-duration:18s;animation-delay:-5s}
.orbs i:nth-child(3){left:6%;bottom:-28vmax;animation-duration:22s;animation-delay:-9s}
@keyframes drift{to{transform:translate3d(9vmax,6vmax,0) scale(1.15)}}
html[data-theme="light"] .orbs i,html[data-theme="soft"] .orbs i{opacity:.55}
#root .auth{animation:rise .6s cubic-bezier(.2,.8,.2,1) both!important;-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
#root .auth>*{animation:rise .55s cubic-bezier(.2,.8,.2,1) both!important}
#root .auth>:nth-child(2){animation-delay:.07s!important}#root .auth>:nth-child(3){animation-delay:.14s!important}#root .auth>:nth-child(4){animation-delay:.21s!important}#root .auth>:nth-child(5){animation-delay:.28s!important}#root .auth>:nth-child(6){animation-delay:.35s!important}#root .auth>:nth-child(n+7){animation-delay:.42s!important}
#root .auth .mark i{animation:bob 3s ease-in-out infinite!important}
#root .auth .mark i:nth-child(2){animation-delay:.4s!important}#root .auth .mark i:nth-child(3){animation-delay:.8s!important}
#root .auth .logo{animation:shine 5s linear infinite!important}
#root .auth .err.shake{animation:shake .4s!important}
@keyframes shake{20%{transform:translateX(-7px)}40%{transform:translateX(6px)}60%{transform:translateX(-4px)}80%{transform:translateX(3px)}}
.auth button.full{position:relative;overflow:hidden}
.auth button.full:not(:disabled)::after{content:"";position:absolute;inset:0;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.45) 50%,transparent 65%);transform:translateX(-120%);animation:sweep 3.2s ease-in-out infinite}
@keyframes sweep{60%,100%{transform:translateX(120%)}}
.splash{position:fixed;inset:0;z-index:100000;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#09090a;transition:opacity .45s,transform .45s}
.splash.out{opacity:0;transform:scale(1.04);pointer-events:none}
.splash .mark{margin-bottom:18px}
.splash .mark i{width:54px;height:54px;margin:0 -11px;animation:bob 1.6s ease-in-out infinite!important}
.splash .mark i:nth-child(2){animation-delay:.2s!important}.splash .mark i:nth-child(3){animation-delay:.4s!important}
.splash .logo{font-size:34px;animation:shine 3s linear infinite!important}
.sbar{width:120px;height:3px;border-radius:3px;background:var(--line);overflow:hidden;margin-top:26px}
.sbar i{display:block;width:40%;height:100%;border-radius:3px;background:var(--text);animation:sload 1.1s ease-in-out infinite}
@keyframes sload{0%{transform:translateX(-110%)}100%{transform:translateX(280%)}}
@media(prefers-reduced-motion:reduce){#root .auth,#root .auth>*,#root .auth .mark i,#root .auth .logo,.orbs i,.auth button.full::after,.splash .mark i,.splash .logo,.sbar i{animation:none!important}}

/* ===== v3: splash, smoothness ===== */
.splash{overflow:hidden;background:radial-gradient(120% 90% at 50% 30%,#1d1d21,#09090a)}
.splash .glow{position:absolute;width:80vmin;height:80vmin;border-radius:50%;background:radial-gradient(circle,rgba(160,160,180,.3),transparent 65%);animation:spulse 2.6s ease-in-out infinite}
.ringbox{position:relative;display:flex;align-items:center;justify-content:center;width:150px;height:110px}
.splash .sring{position:absolute;width:120px;height:120px;border-radius:50%;border:1.5px solid var(--text);opacity:0;animation:ringout 2.6s ease-out infinite}
.splash .sring.r2{animation-delay:1.3s}
.splash .mark{margin:0;transform:scale(1.1);animation:mpop .8s cubic-bezier(.2,.9,.3,1.3) both}
.splash .logo{animation:nm 1s .15s cubic-bezier(.2,.8,.2,1) both,shine 3s 1.2s linear infinite!important}
.splash .tag{margin-top:8px;font-size:12px;letter-spacing:3px;text-transform:uppercase;color:var(--muted,#888);animation:rise .7s .8s both}
.splash .stx{margin-top:12px;font-size:13px;color:var(--muted,#888);animation:rise .6s 1s both}
.splash .stx::after{content:"";animation:dots 1.4s steps(4) infinite}
.splash .sbar{animation:rise .6s .6s both}
@keyframes nm{from{opacity:0;letter-spacing:.35em;filter:blur(8px)}to{opacity:1;letter-spacing:.02em;filter:none}}
@keyframes mpop{from{opacity:0;transform:scale(.4) rotate(-20deg)}to{opacity:1;transform:scale(1.1)}}
@keyframes ringout{0%{transform:scale(.6);opacity:.55}100%{transform:scale(2.8);opacity:0}}
@keyframes spulse{50%{transform:scale(1.15);opacity:.65}}
@keyframes dots{0%{content:""}25%{content:"."}50%{content:".."}75%,100%{content:"..."}}
button,.item,.tabs button,.nav button{-webkit-tap-highlight-color:transparent;transition:transform .16s cubic-bezier(.2,.8,.2,1),background-color .2s,box-shadow .2s,opacity .2s}
button:active,.item:active{transform:scale(.97)}
.body{overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
input,textarea{transition:border-color .2s,box-shadow .2s,background-color .2s}
@media(prefers-reduced-motion:reduce){.splash .glow,.splash .sring,.splash .mark,.splash .logo,.splash .stx::after{animation:none!important}}

.avedit{position:relative;flex:none;cursor:pointer;border-radius:50%}
.avedit .av.big{width:88px;height:88px;font-size:36px;box-shadow:0 0 0 4px var(--card,#17171a)}
.avbadge{position:absolute;right:-2px;bottom:2px;width:30px;height:30px;border-radius:50%;background:var(--btn);color:var(--btntext);display:flex;align-items:center;justify-content:center;box-shadow:0 0 0 3px var(--card,#17171a)}
.avbadge .i{width:16px;height:16px}
.avtext{min-width:0;padding-bottom:4px}
.avuser{display:block;font-size:16px;margin-bottom:8px;overflow:hidden;text-overflow:ellipsis}
.sfields{padding:4px 16px 16px}
.sfields .lbl{margin:14px 2px 6px}
.sfields textarea.ta{margin-bottom:4px}
.sthemes{padding:12px}
.sthemes .themes{margin:0}
.topt{position:relative}
.topt.on{box-shadow:0 0 0 1px var(--text)}
.lsearch{position:sticky;top:0;z-index:3;display:flex;align-items:center;gap:10px;padding:0 14px;margin-bottom:12px;background:var(--panel);border:1px solid var(--line);border-radius:16px;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
.lsearch .i{width:20px;height:20px;flex:none;color:var(--muted)}
.lsearch input{flex:1;min-width:0;border:0!important;background:transparent!important;box-shadow:none!important;margin:0!important;padding:14px 0}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:22px;overflow:hidden}
.lcard .item,.lcard .item.sel{margin:0;border:0;border-radius:0;background:transparent;border-bottom:1px solid var(--line);animation:none;padding:14px 16px}
.lcard .item:last-child{border-bottom:0}
.lcard .item.sel{background:var(--hov)}
.lname{font-size:16px;font-weight:600}
.lsub{font-size:12px;color:var(--muted);margin-top:2px}
.lcard .empty{padding:32px 10px}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,a,input,textarea,select,[role="button"]{touch-action:manipulation}
button:focus-visible,[role="button"]:focus-visible,.item:focus-visible,a:focus-visible{outline:2px solid var(--text);outline-offset:2px}
input:focus-visible,textarea:focus-visible{outline:2px solid var(--text);outline-offset:1px}
img{max-width:100%}
@media(prefers-contrast:more){:root{--line:rgba(255,255,255,.3)}html[data-theme="light"],html[data-theme="soft"]{--line:rgba(0,0,0,.4)}}
</style>

};
const out=new Array(rows.length);
const chunks=[];
for(let i=0;i<rows.length;i+=30)chunks.push(i);
const doChunk=async i=>{
const part=rows.slice(i,i+30);
let lines=null;
try{lines=(await call1(part.join("\n"))).replace(/\n+$/,"").split("\n");if(lines.length!==part.length)lines=null}catch(e){if(i===0&&e.message&&e.message.indexOf("http")===0)throw e}

const fake=u=>u+"@grouphangout.app";

async function doLogin(f,err){
const u=f.u.value.trim().toLowerCase(),p=f.p.value;
if(!u||!p){err.textContent="Enter your username and password.";return}
try{freshLogin=true;justAuthed=true;await auth.signInWithEmailAndPassword(fake(u),p)}
catch(e){freshLogin=false;justAuthed=false;err.textContent="Wrong username or password."}
}

async function doSignup(f,err){
const u=f.u.value.trim().toLowerCase(),e=f.e.value.trim(),p=f.p.value,c=f.c.value;
if(!/^[a-z0-9_]{3,20}$/.test(u)){err.textContent="Username: 3-20 letters, numbers or underscores.";return}
if(!/^\S+@\S+\.\S+$/.test(e)){err.textContent="Enter a valid email.";return}
if(p.length<6){err.textContent="Password must be at least 6 characters.";return}
if(p!==c){err.textContent="Passwords do not match.";return}
try{
justAuthed=true;
const cred=await auth.createUserWithEmailAndPassword(fake(u),p);
await db.collection("users").doc(cred.user.uid).set({username:u,email:e});
await db.collection("profiles").doc(u).set({username:u,uid:cred.user.uid});
}catch(x){justAuthed=false;err.textContent=x.code==="auth/email-already-in-use"?"That username is taken.":"Could not sign up. Try again."}
}

function shrinkImage(file){

im.onload=()=>{

let q=0.72,out=cv.toDataURL("image/jpeg",q);
while(out.length>600000&&q>0.35){q-=0.1;out=cv.toDataURL("image/jpeg",q)}

}

function hideRing(){stopRing();if(ringEl){ringEl.remove();ringEl=null}}

n.onclick=()=>{try{window.focus()}catch(e){}if(chat)openById(chat);n.close()};
}catch(e){}
}

function showRing(id,c){
if(ringEl&&ringEl.dataset.id===id)return;
hideRing();
const who=nameOf(id,c),gr=!id.startsWith("dm_");
const g=gr?groups.find(x=>x.id===id):null;
const rb=(cls,icon,label,fn)=>h("div",{class:"rcol"},h("button",{class:"rb "+cls,"aria-label":label,onclick:fn},ic(icon)),h("span",{text:label}));
ringEl=h("div",{class:"ringfull","data-id":id},
h("div",{class:"rmid"},avatar(who,g?g.icon||"":"",gr),h("div",{class:"rname",text:who}),h("div",{class:"rsub",text:gr?"Group call ringing...":"Incoming call..."})),
h("div",{class:"racts"},
rb("rd","phone","Decline",()=>{dismissed[id]=true;hideRing()}),
rb("rv","cam","Video",()=>startCall(id,who,gr,true)),

function onCalls(){
for(const id in dismissed){const c=calls[id];if(!c||!liveMembers(c).length)delete dismissed[id]}
let inc=null;
if(!call)for(const id in calls){
if(dismissed[id])continue;
const ms=liveMembers(calls[id]);
if(ms.length&&!ms.includes(me)){inc=id;break}
}
inc?showRing(inc,calls[inc]):hideRing();
if(call)syncPeers();
const sig=Object.keys(calls).map(id=>id+":"+liveMembers(calls[id]).join(",")).sort().join("|");
if(sig!==lastSig){lastSig=sig;doPaint();bannerPaint()}
}
setInterval(()=>{if(db&&me)onCalls()},5000);

const CallKeep=NATIVE&&window.Capacitor.Plugins?window.Capacitor.Plugins.CallKeep:null;
function keepAlive(on,title){
try{
if(CallKeep)Promise.resolve(on?CallKeep.start({title}):CallKeep.stop()).catch(()=>{});
if("mediaSession" in navigator){
if(on){navigator.mediaSession.metadata=new MediaMetadata({title:"In a call",artist:title});navigator.mediaSession.playbackState="playing"}
else{navigator.mediaSession.playbackState="none";navigator.mediaSession.metadata=null}
}
}catch(e){}
}
function bgTick(fn,ms){
try{
const url=URL.createObjectURL(new Blob(["setInterval(function(){postMessage(1)},"+ms+")"],{type:"text/javascript"}));
const w=new Worker(url);
w.onmessage=()=>fn();
return()=>{w.terminate();URL.revokeObjectURL(url)};
}catch(e){const i=setInterval(fn,ms);return()=>clearInterval(i)}
}
async function reviveMic(c){
const t=c.stream.getAudioTracks()[0];
if(t&&t.readyState==="live")return;
try{
const ns=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1}});
const nt=ns.getAudioTracks()[0];
nt.enabled=!c.muted;
nt.onended=()=>{if(call===c)reviveMic(c)};
Object.values(c.peers).forEach(p=>{const sn=p.pc.getSenders().find(x=>x.track&&x.track.kind==="audio")||p.pc.getSenders().find(x=>!x.track);if(sn)sn.replaceTrack(nt).catch(()=>{})});
c.stream.getTracks().forEach(x=>x.stop());
c.stream=ns;
}catch(e){}
}

async function upsertMe(ref,inv){
const f={["p."+me]:SERVER()};
try{await ref.update(f)}
catch(e){
if(e.code!=="not-found")throw e;
try{await ref.set({invited:inv,p:{[me]:SERVER()}})}catch(x){await ref.update(f)}
}
}

async function startCall(id,title,isGroup,video){
if(call)return;
if(!navigator.onLine){alert("Calls need an internet connection. Texts still queue and send when you're back online.");return}
let stream;
try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true,channelCount:1,sampleRate:48000}})}
catch(e){alert("Allow microphone access to use voice.");return}
await loadTurn();
const g=isGroup?groups.find(x=>x.id===id):null;
const inv=(calls[id]&&calls[id].invited)||(g?g.members:[me,title].sort());
hideRing();
const c=call={id,title,stream,peers:{},early:{},unsubs:[],chain:Promise.resolve(),members:[me],t0:Date.now(),since:Date.now()-30000,muted:false,vid:{},media:{},vels:{}};
c.caller=!(calls[id]&&liveMembers(calls[id]).some(x=>x!==me));
const ref=db.collection("calls").doc(id);
try{await upsertMe(ref,inv)}
catch(e){stream.getTracks().forEach(t=>t.stop());call=null;alert("Could not start the call.");return}
c.beat=()=>ref.update({["p."+me]:SERVER()}).catch(()=>{});
c.hb=bgTick(c.beat,10000);
const at=stream.getAudioTracks()[0];
if(at)at.onended=()=>{if(call===c)reviveMic(c)};
keepAlive(true,title);
c.tk=setInterval(tick,1000);
c.unsubs.push(db.collection("calls/"+id+"/sig").where("to","==",me).onSnapshot(sn=>{
if(call!==c)return;
const add=[];
sn.docChanges().forEach(ch=>{if(ch.type!=="added")return;const s=ch.doc.data();ch.doc.ref.delete().catch(()=>{});if(s.t>=c.since)add.push(s)});
add.sort((a,b)=>a.t-b.t).forEach(s=>{c.chain=c.chain.then(()=>onSig(c,s)).catch(()=>{})});
}));
renderCall();
onCalls();
if(video)toggleCam(c);
}

function sendSig(c,to,cid,k,d){db.collection("calls/"+c.id+"/sig").add({from:me,to,cid,k,d,t:Date.now()}).catch(()=>{})}

function makePC(c,m,cid,answering){
const pc=new RTCPeerConnection(ICE);
const p={pc,cid,m,queue:[],ready:false,state:"connecting",audio:null};
c.stream.getTracks().forEach(t=>{const sn=pc.addTrack(t,c.stream);try{const pr=sn.getParameters();pr.encodings=pr.encodings&&pr.encodings.length?pr.encodings:[{}];pr.encodings[0].maxBitrate=64000;pr.encodings[0].networkPriority="high";pr.encodings[0].priority="high";sn.setParameters(pr).catch(()=>{})}catch(e){}});
if(!answering){
p.cT=pc.addTransceiver("video",{direction:"sendrecv"});
p.sT=pc.addTransceiver("video",{direction:"sendrecv"});
if(c.camTrack)p.cT.sender.replaceTrack(c.camTrack).catch(()=>{});
if(c.scrTrack)p.sT.sender.replaceTrack(c.scrTrack).catch(()=>{});
}
/* The answering side must NOT pre-create its own video slots: the browser ignores them and
   makes new receive-only ones from the offer, so its camera and screen never reached the caller.
   It adopts the two slots made by the offer instead (first = camera, second = screen). */
p.adopt=()=>{
const vs=pc.getTransceivers().filter(t=>t.receiver.track.kind==="video");
p.cT=vs[0];p.sT=vs[1];
vs.forEach(t=>{try{t.direction="sendrecv"}catch(e){}});
if(c.camTrack&&p.cT)p.cT.sender.replaceTrack(c.camTrack).catch(()=>{});
if(c.scrTrack&&p.sT)p.sT.sender.replaceTrack(c.scrTrack).catch(()=>{});
};
pc.onicecandidate=e=>{if(e.candidate)sendSig(c,m,cid,"ice",JSON.stringify(e.candidate))};
pc.ontrack=e=>{
if(e.track.kind==="video"){
const vs=pc.getTransceivers().filter(t=>t.receiver.track.kind==="video"),k=vs.indexOf(e.transceiver)===0?"cam":"scr";
(c.vid[m]=c.vid[m]||{})[k]=new MediaStream([e.track]);
e.track.onunmute=()=>{if(call===c)renderCall()};
if(call===c)renderCall();
return;
}
if(!p.audio){p.audio=new Audio();p.audio.autoplay=true;p.audio.setAttribute("playsinline","");document.body.append(p.audio)}
p.audio.srcObject=e.streams[0];
p.audio.play().catch(()=>{});
if(c.speaker)boost(c,p);
};
pc.onconnectionstatechange=()=>{
if(call!==c||c.peers[m]!==p)return;
p.state=pc.connectionState;
if(p.state==="connected"){c.everUp=true;if(!p.up){p.up=true;sfx("join")}setRate(c,p);bcast(c,m)}
else if((p.state==="disconnected"||p.state==="failed")&&p.up){p.up=false;sfx("leave")}
clearTimeout(p.dt);
if(p.state==="failed")closePeer(c,m),setTimeout(syncPeers,2000);
else if(p.state==="disconnected")p.dt=setTimeout(()=>{if(call===c&&c.peers[m]===p&&pc.connectionState!=="connected"){closePeer(c,m);syncPeers()}},5000);
renderCall();
};
c.peers[m]=p;
(c.early[cid]||[]).forEach(s=>p.queue.push(s.d));
delete c.early[cid];
return p;
}

function closePeer(c,m){
const p=c.peers[m];if(!p)return;
clearTimeout(p.dt);
try{p.pc.close()}catch(e){}
unboost(p);
if(p.audio){p.audio.srcObject=null;p.audio.remove()}
delete c.peers[m];
delete c.vid[m];
}

async function flushIce(p){
p.ready=true;
for(const d of p.queue.splice(0))await p.pc.addIceCandidate(JSON.parse(d)).catch(()=>{});
}

async function onSig(c,s){
if(call!==c)return;
const m=s.from;
if(s.k==="hostmute"){const G=groups.find(x=>x.id===c.id);if(G&&G.meeting&&G.owner===m){if(s.d==="1"){if(!c.muted)toggleMute(c);toast("The host muted you","",null,true)}else toast("The host asks you to unmute","Tap the mic button when ready",null,true)}return}
if(s.k==="media"){try{c.media[m]=JSON.parse(s.d)}catch(e){}renderCall();return}
if(s.k==="offer"){
if(m>me)return; /* the alphabetically smaller name always makes the offer */
closePeer(c,m);
const p=makePC(c,m,s.cid,true);
await p.pc.setRemoteDescription(JSON.parse(s.d));
p.adopt();
await flushIce(p);
const a=await p.pc.createAnswer();
await p.pc.setLocalDescription(a);
sendSig(c,m,s.cid,"answer",JSON.stringify(p.pc.localDescription));
return;
}
const p=c.peers[m];
if(!p||p.cid!==s.cid){(c.early[s.cid]=c.early[s.cid]||[]).push(s);return}
if(s.k==="answer"){await p.pc.setRemoteDescription(JSON.parse(s.d));await flushIce(p)}
else if(s.k==="ice"){if(p.ready)await p.pc.addIceCandidate(JSON.parse(s.d)).catch(()=>{});else p.queue.push(s.d)}
}

async function offerTo(c,m){
const cid=Math.random().toString(36).slice(2,12);
const p=makePC(c,m,cid);
try{
const o=await p.pc.createOffer();
await p.pc.setLocalDescription(o);
sendSig(c,m,cid,"offer",JSON.stringify(p.pc.localDescription));
}catch(e){closePeer(c,m)}
}

function syncPeers(){
const c=call;if(!c)return;
const d=calls[c.id];
const live=d?liveMembers(d):[];
if(!live.includes(me))live.push(me);
c.members=live;
Object.keys(c.peers).forEach(m=>{if(!live.includes(m)){const q=c.peers[m];if(q&&q.up){q.up=false;sfx("leave")}closePeer(c,m);delete c.media[m]}});
live.forEach(m=>{if(m!==me&&!c.peers[m]&&me<m)offerTo(c,m)});
const tn=Object.keys(c.peers).length;
if(c.tn!==tn){c.tn=tn;Object.values(c.peers).forEach(q=>setRate(c,q))}
renderCall();
}

function tick(){
const c=call;if(!c||!c.stat)return;
const others=c.members.filter(x=>x!==me);
const up=others.some(m=>c.peers[m]&&c.peers[m].state==="connected");
if(!up&&c.caller&&!c.everUp&&c.id.startsWith("dm_")&&Date.now()-c.t0<45000&&(!c.rbT||Date.now()-c.rbT>3000)){c.rbT=Date.now();sfx("back")}
let txt;
if(!others.length){txt=c.id.startsWith("dm_")?"Calling...":"Waiting for others"}
else if(!up){txt="Connecting..."}
else{const t=Math.floor((Date.now()-c.t0)/1000);txt=String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")}
c.stat.textContent=txt;
if(c.pstat)c.pstat.textContent=txt;
if(up&&!c.qT){c.qT=setInterval(()=>probeQuality(c),4000)}
}

/* light connection check: marks a peer "Weak" on high delay or packet loss */
async function probeQuality(c){
if(call!==c||document.visibilityState!=="visible")return;
let changed=false;
for(const m of Object.keys(c.peers)){
const p=c.peers[m];if(!p||p.state!=="connected")continue;
try{
const st=await p.pc.getStats();
let rtt=0,lost=0,recv=0;
st.forEach(r=>{
if(r.type==="candidate-pair"&&r.nominated&&r.currentRoundTripTime!=null)rtt=r.currentRoundTripTime;
if(r.type==="inbound-rtp"&&r.kind==="audio"){lost=r.packetsLost||0;recv=r.packetsReceived||0}
});
const dl=lost-(p.lastLost||0),dr=recv-(p.lastRecv||0);
p.lastLost=lost;p.lastRecv=recv;
const bad=rtt>0.4||(dr+dl>20&&dl/(dr+dl)>0.08);
if(bad!==!!p.weak){p.weak=bad;changed=true}
}catch(e){}
}
if(changed&&call===c)renderCall();
}

function paintPill(c){
if(c.pill)c.pill.remove();
c.pstat=h("span",{class:"pst"});
const mt=h("button",{"aria-label":"Mute",onclick:e=>{e.stopPropagation();toggleMute(c)}},ic(c.muted?"micoff":"mic"));
const en=h("button",{class:"pend","aria-label":"Leave call",onclick:e=>{e.stopPropagation();leaveCall()}},ic("phone"));
c.pill=h("div",{class:"cpill",role:"button",tabindex:"0","aria-label":"Return to call",onclick:()=>{c.min=false;renderCall()}},ic("phone"),h("span",{class:"pt",text:c.title}),c.pstat,mt,en);
document.body.append(c.pill);
tick();
}

const ScreenCap=NATIVE&&window.Capacitor.Plugins?window.Capacitor.Plugins.ScreenCap:null;
const HASDISPLAY=!!(navigator.mediaDevices&&navigator.mediaDevices.getDisplayMedia);
const CANSHARE=HASDISPLAY||!!ScreenCap;
let turnLoaded=false;
async function loadTurn(){
if(turnLoaded)return;
turnLoaded=true;
try{
const d=await db.collection("config").doc("turn").get();
const sv=d.exists?d.data().servers:null;
if(Array.isArray(sv)&&sv.length)ICE.iceServers=ICE.iceServers.concat(sv);
}catch(e){}
}

function unboost(p){
if(!p.wa)return;
try{p.wa.src.disconnect();p.wa.g.disconnect();p.wa.k.disconnect()}catch(e){}
p.wa=null;
}
function boost(c,p){
if(!p.audio)return;
try{
if(c.speaker&&p.audio.srcObject){
const ctx=actx=actx||new(window.AudioContext||window.webkitAudioContext)();
if(ctx.state==="suspended")ctx.resume();
if(!p.wa||p.wa.stream!==p.audio.srcObject){
unboost(p);
const src=ctx.createMediaStreamSource(p.audio.srcObject),g=ctx.createGain(),k=ctx.createDynamicsCompressor();
g.gain.value=3;
src.connect(g);g.connect(k);k.connect(ctx.destination);
p.wa={src,g,k,stream:p.audio.srcObject};
}
p.audio.muted=true;
}else{
unboost(p);
p.audio.muted=false;
p.audio.play().catch(()=>{});
}
}catch(e){
unboost(p);
p.audio.muted=false;
}
}
function setSpeaker(c,on){
c.speaker=on;
Object.values(c.peers).forEach(p=>boost(c,p));
renderCall();
}
function toggleMute(c){
c.muted=!c.muted;
c.stream.getAudioTracks().forEach(t=>t.enabled=!c.muted);
bcast(c);
renderCall();
}

function bcast(c,only){
const d=JSON.stringify({cam:!!c.camTrack,scr:!!c.scrTrack,mu:!!c.muted});
(only?[only]:Object.keys(c.peers)).forEach(m=>sendSig(c,m,"media","media",d));
}

function setRate(c,p){
const n=Math.max(1,Object.keys(c.peers).length);
const cam=n===1?[1,2500000,30]:n===2?[1,1500000,30]:n===3?[1.25,900000,24]:[2,350000,15];
const scr=n===1?[1,2500000,15]:n===2?[1,1600000,12]:n===3?[1.25,1000000,10]:[1.5,900000,8];
[[p.cT,cam],[p.sT,scr]].forEach(([T,q])=>{
try{
const sn=T.sender,pr=sn.getParameters();
if(!pr.encodings||!pr.encodings.length)pr.encodings=[{}];
const e=pr.encodings[0];
e.scaleResolutionDownBy=q[0];
e.maxBitrate=q[1];
e.maxFramerate=q[2];
sn.setParameters(pr).catch(()=>{});
}catch(x){}
});
}

function attach(c,k,t){
Object.values(c.peers).forEach(p=>{
const T=k==="cam"?p.cT:p.sT;
if(T)T.sender.replaceTrack(t).then(()=>setRate(c,p)).catch(()=>{});
});
bcast(c);
renderCall();
}

function stopTrack(c,k){
const t=k==="cam"?c.camTrack:c.scrTrack;
if(t)t.stop();
if(k==="cam"){c.camTrack=null;c.lcam=null}else c.scrTrack=null;
Object.values(c.peers).forEach(p=>{
const T=k==="cam"?p.cT:p.sT;
if(T)T.sender.replaceTrack(null).catch(()=>{});
});
bcast(c);
renderCall();
}

async function toggleCam(c){
if(c.camTrack){stopTrack(c,"cam");return}
let st;
try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:c.facing||"user",width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}}})}
catch(e){alert("Allow camera access to turn on video.");return}
if(call!==c){st.getTracks().forEach(t=>t.stop());return}
const t=st.getVideoTracks()[0];
t.onended=()=>{if(call===c&&c.camTrack===t)stopTrack(c,"cam")};
try{t.contentHint="motion"}catch(e){}
c.camTrack=t;
c.lcam=new MediaStream([t]);
attach(c,"cam",t);
}

async function flipCam(c){
if(!c.camTrack||c.flipping)return;
c.flipping=true;
const want=c.facing==="environment"?"user":"environment";
const old=c.camTrack;
old.onended=null;
old.stop();
let st;
try{st=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:want},width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30,max:30}}})}
catch(e){c.flipping=false;stopTrack(c,"cam");return}
c.flipping=false;
if(call!==c){st.getTracks().forEach(t=>t.stop());return}
const t=st.getVideoTracks()[0];
try{t.contentHint="motion"}catch(e){}
t.onended=()=>{if(call===c&&c.camTrack===t)stopTrack(c,"cam")};
c.facing=want;
c.camTrack=t;
c.lcam=new MediaStream([t]);
attach(c,"cam",t);
}

async function nativeScreen(c){
const cv=document.createElement("canvas");
cv.width=16;
cv.height=16;
const cx=cv.getContext("2d");
const track=cv.captureStream(0).getVideoTracks()[0];
let last=null,busy=false,done=false,hb=null,l1=null,l2=null;
const draw=im=>{
if(cv.width!==im.naturalWidth||cv.height!==im.naturalHeight){cv.width=im.naturalWidth;cv.height=im.naturalHeight}
cx.drawImage(im,0,0);
if(track.requestFrame)track.requestFrame();
};
l1=await ScreenCap.addListener("frame",f=>{
if(busy||done)return;
busy=true;
const im=new Image();
im.onload=()=>{last=im;draw(im);busy=false};
im.onerror=()=>{busy=false};
im.src="data:image/jpeg;base64,"+f.d;
});
l2=await ScreenCap.addListener("stopped",()=>{if(call===c&&c.scrTrack===track)stopTrack(c,"scr")});
const cleanup=()=>{
if(done)return;
done=true;
if(hb)hb();
try{l1.remove()}catch(e){}
try{l2.remove()}catch(e){}
Promise.resolve(ScreenCap.stop()).catch(()=>{});
};
try{await ScreenCap.start({})}
catch(e){cleanup();track.stop();throw e}
hb=bgTick(()=>{if(last&&!done)draw(last)},1000);
const orig=track.stop.bind(track);
track.stop=()=>{orig();cleanup()};
return track;
}

async function toggleScreen(c){
if(c.scrTrack){stopTrack(c,"scr");return}
if(c.scrBusy)return;
c.scrBusy=true;
try{
let t=null;
if(ScreenCap){
try{t=await nativeScreen(c)}catch(e){alert("Screen sharing was not allowed.");return}
}else if(HASDISPLAY){
let st;
try{st=await navigator.mediaDevices.getDisplayMedia({video:{frameRate:{ideal:15,max:30}},audio:false})}
catch(e){return}
t=st.getVideoTracks()[0];
}
if(!t)return;
if(call!==c){t.stop();return}
try{t.contentHint="detail"}catch(e){}
t.onended=()=>{if(call===c&&c.scrTrack===t)stopTrack(c,"scr")};
c.scrTrack=t;
attach(c,"scr",t);
}finally{c.scrBusy=false}
}

function src(c,m,k){
if(m===me)return k==="cam"?c.lcam:null;
const s=c.media[m];
return s&&s[k]&&c.vid[m]&&c.vid[m][k]?c.vid[m][k]:null;
}

function vel(c,m,k){
const key=m+":"+k,s=src(c,m,k);
