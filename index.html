<script>
/* tiny error chip: tap the "!" to read the last errors (only appears if something breaks) */
(function(){
var L=[],chip,panel;
function ui(){
if(chip||!document.body)return;
chip=document.createElement("button");chip.textContent="!";
chip.style.cssText="position:fixed;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 84px);z-index:99999;width:28px;height:28px;border-radius:50%;border:0;padding:0;background:rgba(120,20,20,.85);color:#fff;font:700 14px system-ui;opacity:.7";
panel=document.createElement("pre");
panel.style.cssText="display:none;position:fixed;left:8px;right:8px;bottom:calc(env(safe-area-inset-bottom,0px) + 120px);z-index:99999;margin:0;padding:10px;background:rgba(20,20,22,.97);border:1px solid rgba(255,255,255,.2);border-radius:12px;color:#fff;font:11px/1.35 monospace;white-space:pre-wrap;word-break:break-all;max-height:50%;overflow:auto";
chip.onclick=function(){var open=panel.style.display==="none";panel.style.display=open?"block":"none";panel.textContent=L.slice(-8).join("\n\n")};
document.body.appendChild(chip);document.body.appendChild(panel)}
function add(t){L.push(t);ui()}
addEventListener("error",function(e){if(!e.message)return;add("ERR: "+e.message+" @"+String(e.filename||"").split("/").pop()+":"+e.lineno)},true);
addEventListener("unhandledrejection",function(e){var r=e.reason;add("REJ: "+(r&&(r.message||r.stack)||r))});
addEventListener("DOMContentLoaded",function(){if(L.length)ui()});
})();
</script>

.vtime{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:30px;text-align:right}
.toast{position:fixed;left:12px;right:12px;top:calc(env(safe-area-inset-top,0px) + 12px);max-width:520px;margin:0 auto;z-index:70;padding:12px 14px;background:rgba(30,30,33,.97);border:1px solid rgba(255,255,255,.2);border-radius:18px;box-shadow:0 16px 50px rgba(0,0,0,.6);display:flex}

.ythumb{position:relative;aspect-ratio:16/9;background:#000;border-radius:12px;overflow:hidden;cursor:pointer}
.ythumb img{width:100%;height:100%;object-fit:cover;display:block}
.yplay{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(0,0,0,.65);border:2px solid #fff;display:flex;align-items:center;justify-content:center}

.pic{display:block;max-width:min(260px,100%);height:auto;border-radius:12px}
.fileb{display:flex;align-items:center;gap:10px;min-width:190px;cursor:pointer}
.fic{width:40px;height:40px;border-radius:12px;background:rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;flex:none}

function ic(n){return h("span",{class:"i",html:SVG[n]})}
function avatar(label,icon,group){
if(icon&&icon.startsWith("data:"))return h("img",{class:"av",src:icon,alt:""});
if(group)return h("div",{class:"av",style:"background:"+shade(label),html:SVG.users});
const pd=profData[label];
if(pd&&pd.avatar)return h("img",{class:"av",src:pd.avatar,alt:""});
return h("div",{class:"av",text:label[0].toUpperCase(),style:"background:"+shade(label)});
}
function toIcon(file){
return new Promise((res,rej)=>{
const img=new Image();
const url=URL.createObjectURL(file);
img.onload=()=>{
const n=128,c=document.createElement("canvas");
c.width=n;c.height=n;
const x=c.getContext("2d");
const m=Math.min(img.width,img.height);
x.drawImage(img,(img.width-m)/2,(img.height-m)/2,m,m,0,0,n,n);
URL.revokeObjectURL(url);
res(c.toDataURL("image/jpeg",0.8));
};
img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error("bad image"))};
img.src=url;
});
}

function logo(){return h("div",{class:"hero"},h("div",{class:"mark"},h("i"),h("i"),h("i")),h("div",{class:"logo",text:"Group Hangout"}))}
function shade(s){let n=0;for(const c of s)n+=c.charCodeAt(0);return"linear-gradient(135deg,hsl(0 0% "+(40+n%20)+"%),hsl(0 0% 14%))"}

function syncPills(){const on=navigator.onLine;document.querySelectorAll(".pill").forEach(e=>{e.textContent=on?"Online":"Offline";e.className="pill "+(on?"on":"off")});document.querySelectorAll(".send input").forEach(i=>i.placeholder=on?"Message":"Offline - messages send when you reconnect")}
function pill(){const e=h("span",{class:"pill"});setTimeout(syncPills,0);return e}
addEventListener("online",()=>{syncPills();if(db)db.enableNetwork().catch(()=>{})});
addEventListener("offline",syncPills);
function showMessage(t){root.className="";root.textContent="";root.append(h("div",{class:"auth"},logo(),h("div",{class:"sub",text:t})))}

function showAuth(mode){
root.className="";
root.textContent="";
const err=h("div",{class:"err"});
const f={};
const field=(k,ph,type)=>f[k]=h("input",{placeholder:ph,type:type||"text",autocomplete:"off",autocapitalize:"none"});
const signup=mode==="signup";
const fields=signup?[field("u","Username"),field("e","Email","email"),field("p","Password","password"),field("c","Confirm password","password")]:[field("u","Username"),field("p","Password","password")];
const go=h("button",{class:"full",text:signup?"Sign up":"Log in"});
go.onclick=async()=>{
err.textContent="";
go.disabled=true;
try{signup?await doSignup(f,err):await doLogin(f,err)}catch(e){err.textContent="Something went wrong. Try again."}
go.disabled=false;
};
const tab=(m,l)=>h("button",{class:m===mode?"on":"",text:l,onclick:()=>showAuth(m)});
root.append(h("div",{class:"auth"},
logo(),
h("div",{class:"sub",text:"Meet up, chat and plan with your people"}),
h("div",{class:"tabs"},tab("login","Log in"),tab("signup","Sign up")),
fields,err,go));
}

const fake=u=>u+"@grouphangout.app";

async function doLogin(f,err){
const u=f.u.value.trim().toLowerCase(),p=f.p.value;
if(!u||!p){err.textContent="Enter your username and password.";return}
try{await auth.signInWithEmailAndPassword(fake(u),p)}
catch(e){err.textContent="Wrong username or password."}
}

async function doSignup(f,err){
const u=f.u.value.trim().toLowerCase(),e=f.e.value.trim(),p=f.p.value,c=f.c.value;
if(!/^[a-z0-9_]{3,20}$/.test(u)){err.textContent="Username: 3-20 letters, numbers or underscores.";return}
if(!/^\S+@\S+\.\S+$/.test(e)){err.textContent="Enter a valid email.";return}
if(p.length<6){err.textContent="Password must be at least 6 characters.";return}
if(p!==c){err.textContent="Passwords do not match.";return}
try{
const cred=await auth.createUserWithEmailAndPassword(fake(u),p);
await db.collection("users").doc(cred.user.uid).set({username:u,email:e});
await db.collection("profiles").doc(u).set({username:u,uid:cred.user.uid});
}catch(x){err.textContent=x.code==="auth/email-already-in-use"?"That username is taken.":"Could not sign up. Try again."}
}

function logout(){
stopNearby();leaveCall();calls={};hideRing();curChat=null;pendingOpen=null;nearRun=false;nearErr="";
subs.forEach(u=>u());subs=[];
if(chatUnsub){chatUnsub();chatUnsub=null}
friends=[];groups=[];profiles=[];incoming=[];outgoing=[];picked=new Set();me=null;hidden=new Set();profData={};devAt=0;acctBtn=null;
const u0=uid;
const clr=u0?Promise.all([db.collection("users").doc(u0).update({fcm:firebase.firestore.FieldValue.delete()}).catch(()=>{}),db.collection("users").doc(u0).collection("devices").doc(devId()).delete().catch(()=>{})]):Promise.resolve();
Promise.race([clr,new Promise(r=>setTimeout(r,2500))]).then(()=>auth.signOut());
}

function home(){
subs.forEach(u=>u());subs=[];
subs.push(db.collection("friends").where("members","array-contains",me).onSnapshot(s=>{friends=s.docs.map(d=>d.data().members.find(x=>x!==me)).filter(Boolean);doPaint()}));
subs.push(db.collection("groups").where("members","array-contains",me).onSnapshot(s=>{groups=s.docs.map(d=>({id:d.id,...d.data()}));doPaint();if(pendingOpen){const o=pendingOpen;pendingOpen=null;openById(o)}}));
subs.push(db.collection("profiles").limit(500).onSnapshot(s=>{profiles=s.docs.map(d=>d.data().username);s.docs.forEach(d=>{const x=d.data();profData[x.username]={avatar:x.avatar||"",bio:x.bio||"",name:x.name||""}});refreshAcctBtn();doPaint()}));
subs.push(db.collection("requests").where("to","==",me).onSnapshot(s=>{incoming=s.docs.map(d=>d.data()).filter(r=>r.status==="pending");updateBell();doPaint();notesPaint()}));
subs.push(db.collection("requests").where("from","==",me).onSnapshot(s=>{outgoing=s.docs.map(d=>d.data());doPaint()}));
subs.push(db.collection("calls").where("invited","array-contains",me).onSnapshot(s=>{calls={};s.docs.forEach(d=>{calls[d.id]={id:d.id,...d.data()}});onCalls()}));
subs.push(db.collection("pings").where("to","==",me).onSnapshot(s=>{
s.docChanges().forEach(ch=>{
if(ch.type!=="added")return;
const p=ch.doc.data();
ch.doc.ref.delete().catch(()=>{});
if(curChat===p.chat&&document.visibilityState==="visible")return;
toast(p.from+" pinged you in "+p.title,p.text||"",()=>openById(p.chat));
});
}));
draw("chats");
startNearby();
initPush();
if(shareText)openShare();
}


function updateBell(){document.querySelectorAll(".badge").forEach(b=>{b.textContent=incoming.length||""})}
function bell(){
const b=h("button",{class:"ghost bell","aria-label":"Notifications",onclick:openNotes},ic("bell"),h("span",{class:"badge"}));
setTimeout(updateBell,0);
return b;
}

async function respond(u,ok){
const ref=db.collection("requests").doc(u+"__"+me);
try{
if(ok){
const b=db.batch();
b.set(db.collection("friends").doc(pair(me,u)),{members:[me,u].sort()});
b.update(ref,{status:"accepted"});
await b.commit();
}else await ref.update({status:"blocked"});
}catch(e){}
}

/* ---------- profiles, account page, devices ---------- */

ov.append(h("div",{class:"mcard"},content));

function showProfile(n){
if(!n)return;
if(n===me){openAccount();return}
const card=h("div",{class:"pcard"});
let close;
const fill=()=>{
const p=profData[n]||{};
const a=avatar(n);a.classList.add("big");
card.textContent="";
card.append(a,h("div",{class:"pname",text:dispName(n)}),h("div",{class:"muted",text:"@"+n}),
h("div",{class:"pbio"+(p.bio?"":" muted"),text:p.bio||"No description yet."}),
h("div",{class:"acts center",style:"margin-top:18px"},h("button",{class:"ghost",text:"Close",onclick:()=>close()})));
};
fill();
close=modal(card);
if(!profData[n]&&db)db.collection("profiles").doc(n).get().then(d=>{if(d.exists){const x=d.data();profData[n]={avatar:x.avatar||"",bio:x.bio||"",name:x.name||""};fill()}}).catch(()=>{});
}

const a=avatar(me);a.classList.add("big");

h("div",{class:"top"},h("button",{class:"ghost back",text:"Back",onclick:closePane}),h("b",{class:"ttl",text:"Account"}),h("span")),
h("div",{class:"body"},
h("div",{class:"acct"},a,h("div",{class:"acctname",text:dispName(me)}),h("div",{class:"muted",text:"@"+me}),p.bio?h("div",{class:"acctbio",text:p.bio}):null),

function openSettings(){
const m=pane();
const cur=profData[me]||{};
let pic;
const prev=h("div");
const paintPrev=()=>{
prev.textContent="";
const src=pic===undefined?cur.avatar:pic;
const a=src?h("img",{class:"av",src,alt:""}):h("div",{class:"av",text:me[0].toUpperCase(),style:"background:"+shade(me)});
a.classList.add("big");
prev.append(a);
};
paintPrev();
const file=h("input",{type:"file",accept:"image/*",style:"display:none"});
file.onchange=async()=>{const f=file.files[0];file.value="";if(!f)return;try{pic=await toIcon(f);paintPrev()}catch(e){alert("Could not use that image.")}};
const nameIn=h("input",{maxlength:"30",placeholder:"Name",autocomplete:"off"});
nameIn.value=cur.name||"";
const bioIn=h("textarea",{maxlength:"200",placeholder:"Add a description",rows:"4",class:"ta"});
bioIn.value=cur.bio||"";
const cnt=h("div",{class:"muted cnt"});
const upd=()=>{cnt.textContent=bioIn.value.length+" / 200"};
bioIn.oninput=upd;upd();
const msg=h("div",{class:"muted",style:"min-height:20px;margin:8px 0"});
const save=h("button",{class:"full",text:"Save"});
save.onclick=async()=>{
save.disabled=true;msg.textContent="Saving...";
const D=firebase.firestore.FieldValue.delete();
const nm=nameIn.value.trim().slice(0,30),bio=bioIn.value.trim().slice(0,200);
const u={name:nm||D,bio:bio||D};
if(pic!==undefined)u.avatar=pic||D;
try{
await db.collection("profiles").doc(me).update(u);
const np={avatar:pic===undefined?(cur.avatar||""):pic,bio:bio,name:nm};
profData[me]=np;Object.assign(cur,np);pic=undefined;

});
}catch(e){}
}
function sfx(name,vol){
if(name==="ring"){phoneRing();return}
try{
const ctx=actx=actx||new(window.AudioContext||window.webkitAudioContext)();
if(ctx.state==="suspended")ctx.resume();
const t0=ctx.currentTime+.02,v=vol||(name==="ring"?.2:.12);
(SFX[name]||[]).forEach(n=>{
const o=ctx.createOscillator(),g=ctx.createGain();
o.type="sine";o.frequency.setValueAtTime(n[0],t0+n[1]);
g.gain.setValueAtTime(.0001,t0+n[1]);
g.gain.exponentialRampToValueAtTime(v,t0+n[1]+.015);
g.gain.exponentialRampToValueAtTime(.0001,t0+n[1]+n[2]);
o.connect(g);g.connect(ctx.destination);
o.start(t0+n[1]);o.stop(t0+n[1]+n[2]+.05);
});
}catch(e){}
}
["pointerdown","keydown","touchstart"].forEach(ev=>addEventListener(ev,()=>{try{actx=actx||new(window.AudioContext||window.webkitAudioContext)();if(actx.state==="suspended")actx.resume()}catch(e){}},{once:true,passive:true}));

}catch(e){}
location.reload();
}

function startRingtone(){stopRing();sfx("ring");if(navigator.vibrate)navigator.vibrate([400,150,400]);ringTimer=setInterval(()=>{sfx("ring");if(navigator.vibrate)navigator.vibrate([400,150,400])},3000)}
function stopRing(){clearInterval(ringTimer);ringTimer=null}
function hideRing(){stopRing();if(ringEl){ringEl.remove();ringEl=null}}
function showRing(id,c){
if(ringEl&&ringEl.dataset.id===id)return;
hideRing();
const who=nameOf(id,c);
ringEl=h("div",{class:"ring","data-id":id},avatar(who),h("div",{class:"grow"},h("div",{text:who}),h("div",{class:"muted",text:"is calling you..."})),
h("button",{class:"ghost sm",text:"Decline",onclick:()=>{dismissed[id]=true;hideRing()}}),
h("button",{class:"sm",text:"Answer",onclick:()=>startCall(id,who,false)}));

}

function onCalls(){
for(const id in dismissed){const c=calls[id];if(!c||!liveMembers(c).length)delete dismissed[id]}
let inc=null;
if(!call)for(const id in calls){
if(!id.startsWith("dm_")||dismissed[id])continue;
const ms=liveMembers(calls[id]);
if(ms.length&&!ms.includes(me)){inc=id;break}
}
inc?showRing(inc,calls[inc]):hideRing();
if(call)syncPeers();
const sig=Object.keys(calls).map(id=>id+":"+liveMembers(calls[id]).join(",")).sort().join("|");
if(sig!==lastSig){lastSig=sig;doPaint();bannerPaint()}
}
setInterval(()=>{if(db&&me)onCalls()},5000);

const CallKeep=NATIVE&&window.Capacitor.Plugins?window.Capacitor.Plugins.CallKeep:null;
function keepAlive(on,title){
try{
if(CallKeep)Promise.resolve(on?CallKeep.start({title}):CallKeep.stop()).catch(()=>{});
if("mediaSession" in navigator){
if(on){navigator.mediaSession.metadata=new MediaMetadata({title:"In a call",artist:title});navigator.mediaSession.playbackState="playing"}
else{navigator.mediaSession.playbackState="none";navigator.mediaSession.metadata=null}
}
}catch(e){}
}
function bgTick(fn,ms){
try{
const url=URL.createObjectURL(new Blob(["setInterval(function(){postMessage(1)},"+ms+")"],{type:"text/javascript"}));
const w=new Worker(url);
w.onmessage=()=>fn();
return()=>{w.terminate();URL.revokeObjectURL(url)};
}catch(e){const i=setInterval(fn,ms);return()=>clearInterval(i)}
}
async function reviveMic(c){
const t=c.stream.getAudioTracks()[0];
if(t&&t.readyState==="live")return;
try{
const ns=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}});
const nt=ns.getAudioTracks()[0];
nt.enabled=!c.muted;
nt.onended=()=>{if(call===c)reviveMic(c)};
Object.values(c.peers).forEach(p=>{const sn=p.pc.getSenders().find(x=>x.track&&x.track.kind==="audio")||p.pc.getSenders().find(x=>!x.track);if(sn)sn.replaceTrack(nt).catch(()=>{})});
c.stream.getTracks().forEach(x=>x.stop());
c.stream=ns;
}catch(e){}
}

async function upsertMe(ref,inv){
const f={["p."+me]:SERVER()};
try{await ref.update(f)}
catch(e){
if(e.code!=="not-found")throw e;
try{await ref.set({invited:inv,p:{[me]:SERVER()}})}catch(x){await ref.update(f)}
}
}

async function startCall(id,title,isGroup){
if(call)return;
if(!navigator.onLine){alert("Calls need an internet connection. Texts still queue and send when you're back online.");return}
let stream;
try{stream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:true,noiseSuppression:true,autoGainControl:true}})}
catch(e){alert("Allow microphone access to use voice.");return}
const g=isGroup?groups.find(x=>x.id===id):null;
const inv=(calls[id]&&calls[id].invited)||(g?g.members:[me,title].sort());
hideRing();
const c=call={id,title,stream,peers:{},early:{},unsubs:[],chain:Promise.resolve(),members:[me],t0:Date.now(),since:Date.now()-30000,muted:false};
c.caller=!(calls[id]&&liveMembers(calls[id]).some(x=>x!==me));
const ref=db.collection("calls").doc(id);
try{await upsertMe(ref,inv)}
catch(e){stream.getTracks().forEach(t=>t.stop());call=null;alert("Could not start the call.");return}
c.beat=()=>ref.update({["p."+me]:SERVER()}).catch(()=>{});
c.hb=bgTick(c.beat,10000);
const at=stream.getAudioTracks()[0];
if(at)at.onended=()=>{if(call===c)reviveMic(c)};
keepAlive(true,title);
c.tk=setInterval(tick,1000);
c.unsubs.push(db.collection("calls/"+id+"/sig").where("to","==",me).onSnapshot(sn=>{
if(call!==c)return;
const add=[];
sn.docChanges().forEach(ch=>{if(ch.type!=="added")return;const s=ch.doc.data();ch.doc.ref.delete().catch(()=>{});if(s.t>=c.since)add.push(s)});
add.sort((a,b)=>a.t-b.t).forEach(s=>{c.chain=c.chain.then(()=>onSig(c,s)).catch(()=>{})});
}));
renderCall();
onCalls();
}

function sendSig(c,to,cid,k,d){db.collection("calls/"+c.id+"/sig").add({from:me,to,cid,k,d,t:Date.now()}).catch(()=>{})}

function makePC(c,m,cid){
const pc=new RTCPeerConnection(ICE);
const p={pc,cid,m,queue:[],ready:false,state:"connecting",audio:null};
c.stream.getTracks().forEach(t=>pc.addTrack(t,c.stream));
pc.onicecandidate=e=>{if(e.candidate)sendSig(c,m,cid,"ice",JSON.stringify(e.candidate))};
pc.ontrack=e=>{
if(!p.audio){p.audio=new Audio();p.audio.autoplay=true;p.audio.setAttribute("playsinline","");document.body.append(p.audio)}
p.audio.srcObject=e.streams[0];
p.audio.play().catch(()=>{});
};
pc.onconnectionstatechange=()=>{
if(call!==c||c.peers[m]!==p)return;
p.state=pc.connectionState;
if(p.state==="connected"){c.everUp=true;if(!p.up){p.up=true;sfx("join")}}
else if((p.state==="disconnected"||p.state==="failed")&&p.up){p.up=false;sfx("leave")}
clearTimeout(p.dt);
if(p.state==="failed")closePeer(c,m),setTimeout(syncPeers,2000);
else if(p.state==="disconnected")p.dt=setTimeout(()=>{if(call===c&&c.peers[m]===p&&pc.connectionState!=="connected"){closePeer(c,m);syncPeers()}},10000);
renderCall();
};
c.peers[m]=p;
(c.early[cid]||[]).forEach(s=>p.queue.push(s.d));
delete c.early[cid];
return p;
}

function closePeer(c,m){
const p=c.peers[m];if(!p)return;
clearTimeout(p.dt);
try{p.pc.close()}catch(e){}
if(p.audio){p.audio.srcObject=null;p.audio.remove()}
delete c.peers[m];
}

async function flushIce(p){
p.ready=true;
for(const d of p.queue.splice(0))await p.pc.addIceCandidate(JSON.parse(d)).catch(()=>{});
}

async function onSig(c,s){
if(call!==c)return;
const m=s.from;
if(s.k==="offer"){
if(m>me)return; /* the alphabetically smaller name always makes the offer */
closePeer(c,m);
const p=makePC(c,m,s.cid);
await p.pc.setRemoteDescription(JSON.parse(s.d));
await flushIce(p);
const a=await p.pc.createAnswer();
await p.pc.setLocalDescription(a);
sendSig(c,m,s.cid,"answer",JSON.stringify(p.pc.localDescription));
return;
}
const p=c.peers[m];
if(!p||p.cid!==s.cid){(c.early[s.cid]=c.early[s.cid]||[]).push(s);return}
if(s.k==="answer"){await p.pc.setRemoteDescription(JSON.parse(s.d));await flushIce(p)}
else if(s.k==="ice"){if(p.ready)await p.pc.addIceCandidate(JSON.parse(s.d)).catch(()=>{});else p.queue.push(s.d)}
}

async function offerTo(c,m){
const cid=Math.random().toString(36).slice(2,12);
const p=makePC(c,m,cid);
try{
const o=await p.pc.createOffer();
await p.pc.setLocalDescription(o);
sendSig(c,m,cid,"offer",JSON.stringify(p.pc.localDescription));
}catch(e){closePeer(c,m)}
}

function syncPeers(){
const c=call;if(!c)return;
const d=calls[c.id];
const live=d?liveMembers(d):[];
if(!live.includes(me))live.push(me);
c.members=live;
Object.keys(c.peers).forEach(m=>{if(!live.includes(m)){const q=c.peers[m];if(q&&q.up){q.up=false;sfx("leave")}closePeer(c,m)}});
live.forEach(m=>{if(m!==me&&!c.peers[m]&&me<m)offerTo(c,m)});
renderCall();
}

function tick(){
const c=call;if(!c||!c.stat)return;
const others=c.members.filter(x=>x!==me);
const up=others.some(m=>c.peers[m]&&c.peers[m].state==="connected");
if(!up&&c.caller&&!c.everUp&&c.id.startsWith("dm_")&&Date.now()-c.t0<45000&&(!c.rbT||Date.now()-c.rbT>3000)){c.rbT=Date.now();sfx("back")}
if(!others.length){c.stat.textContent=c.id.startsWith("dm_")?"Calling...":"Waiting for others"}
else if(!up){c.stat.textContent="Connecting..."}
else{const t=Math.floor((Date.now()-c.t0)/1000);c.stat.textContent=String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0")}
}

function renderCall(){
const c=call;if(!c)return;
if(!c.ui){c.ui=h("div",{class:"callui"});document.body.append(c.ui)}
const u=c.ui;u.textContent="";
c.stat=h("div",{class:"cstat"});
const tiles=c.members.map(m=>{
const p=c.peers[m];
const st=m===me?(c.muted?"Muted":"You"):(p&&p.state==="connected"?"Connected":"Connecting...");
return h("div",{class:"ctile"},avatar(m),h("b",{text:m}),h("div",{class:"muted",text:st}));
});
const mute=h("button",{class:"mt","aria-label":"Mute",onclick:()=>{c.muted=!c.muted;c.stream.getAudioTracks().forEach(t=>t.enabled=!c.muted);renderCall()}},ic(c.muted?"micoff":"mic"));
const end=h("button",{class:"end","aria-label":"Leave call",onclick:leaveCall},ic("phone"));
u.append(h("div",{class:"ctitle",text:c.title}),c.stat,h("div",{class:"cgrid"},tiles),h("div",{class:"cctl"},mute,end));
tick();
}

async function leaveCall(){
const c=call;if(!c)return;
call=null;
sfx("leave");
if(c.hb)c.hb();clearInterval(c.tk);keepAlive(false);
c.unsubs.forEach(f=>f());
Object.keys(c.peers).forEach(m=>closePeer(c,m));
c.stream.getTracks().forEach(t=>t.stop());

}
