<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Group Hangout is offline</title>
<meta name="theme-color" content="#09090a">
<style>html,body{height:100%;margin:0}body{display:flex;flex-direction:column;align-items:center;justify-content:center;background:#09090a;color:#ececee;font:16px/1.4 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;text-align:center;padding:24px}
.m{display:flex;margin-bottom:18px}.m i{width:46px;height:46px;border-radius:50%;margin:0 -9px;border:3px solid #09090a}
.m i:nth-child(1){background:linear-gradient(135deg,#d8d8dd,#6b6b72)}.m i:nth-child(2){background:linear-gradient(135deg,#a2a2aa,#3b3b40)}.m i:nth-child(3){background:linear-gradient(135deg,#66666d,#1f1f22)}
h1{font-size:24px;margin:0 0 8px}p{color:#8e8e95;margin:0 0 22px;max-width:320px}
button{border:0;border-radius:14px;padding:12px 26px;font-size:16px;font-weight:600;background:#e4e4e7;color:#09090a}</style></head>
<body><div class="m"><i></i><i></i><i></i></div><h1>You're offline</h1><p>Group Hangout needs a connection to load. Messages you send will go out as soon as you're back online.</p><button onclick="location.reload()">Try again</button></body></html>
