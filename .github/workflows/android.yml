          package com.grouphangout.app;

          import android.app.Activity;
          import android.content.Context;
          import android.content.Intent;
          import android.media.projection.MediaProjectionManager;
          import androidx.activity.result.ActivityResult;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.ActivityCallback;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ScreenCap")
          public class ScreenCapPlugin extends Plugin {
              private static ScreenCapPlugin inst;
              private static PluginCall starting;

              @Override
              public void load() {
                  inst = this;
              }

              @PluginMethod
              public void start(PluginCall call) {
                  if (ScreenService.running) {
                      call.resolve();
                      return;
                  }
                  MediaProjectionManager m = (MediaProjectionManager) getContext().getSystemService(Context.MEDIA_PROJECTION_SERVICE);
                  startActivityForResult(call, m.createScreenCaptureIntent(), "granted");
              }

              @ActivityCallback
              private void granted(PluginCall call, ActivityResult r) {
                  if (call == null) return;
                  if (r.getResultCode() != Activity.RESULT_OK || r.getData() == null) {
                      call.reject("denied");
                      return;
                  }
                  starting = call;
                  ScreenService.code = r.getResultCode();
                  ScreenService.data = r.getData();
                  try {
                      ContextCompat.startForegroundService(getContext(), new Intent(getContext(), ScreenService.class));
                  } catch (Exception e) {
                      starting = null;
                      call.reject("service");
                  }
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  getContext().stopService(new Intent(getContext(), ScreenService.class));
                  call.resolve();
              }

              static void started(boolean ok, String msg) {
                  PluginCall c = starting;
                  starting = null;
                  if (c == null) return;
                  if (ok) c.resolve();
                  else c.reject(msg == null ? "failed" : msg);
              }

              static void frame(String b64, int w, int h) {
                  ScreenCapPlugin p = inst;
                  if (p == null) return;
                  JSObject o = new JSObject();
                  o.put("d", b64);
                  o.put("w", w);
                  o.put("h", h);
                  p.notifyListeners("frame", o);
              }

              static void ended() {
                  ScreenCapPlugin p = inst;
                  if (p != null) p.notifyListeners("stopped", new JSObject());
              }
          }
