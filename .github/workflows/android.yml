              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.CAMERA" />
              <uses-feature android:name="android.hardware.camera" android:required="false" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION" />
          """
          assert "<application" in m
          if "BLUETOOTH_SCAN" not in m:
              m = m.replace("<application", perms + "\n    <application", 1)
          if "CallService" not in m:
              m = m.replace("</application>", '    <service android:name=".CallService" android:foregroundServiceType="microphone" android:exported="false" />\n    </application>', 1)
          if "ScreenService" not in m:
              m = m.replace("</application>", '    <service android:name=".ScreenService" android:foregroundServiceType="mediaProjection" android:exported="false" />\n    </application>', 1)
          # share target: show up in the Android share sheet for text and links
          if "android.intent.action.SEND" not in m:
              flt = """        <intent-filter>
                      <action android:name="android.intent.action.SEND" />
                      <category android:name="android.intent.category.DEFAULT" />
                      <data android:mimeType="text/plain" />
                  </intent-filter>
              """
              m = m.replace("</activity>", flt + "</activity>", 1)
          mp.write_text(m)

          # 2) min SDK 23 (Nearby)
          vp = pathlib.Path("android/variables.gradle")
          v = vp.read_text()
          v = re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = 23", v)
          vp.write_text(v)

          # 3) Nearby dependency
          gp = pathlib.Path("android/app/build.gradle")
          g = gp.read_text()
          if "play-services-nearby" not in g:
              g = re.sub(r"(\ndependencies \{\n)", r'\1    implementation "com.google.android.gms:play-services-nearby:19.1.0"\n', g, count=1)
              assert "play-services-nearby" in g
          gp.write_text(g)
          print("patched")
