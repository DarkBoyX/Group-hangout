          package com.grouphangout.app;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.util.Base64;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "Files")
          public class FilesPlugin extends Plugin {
              @PluginMethod
              public void save(PluginCall call) {
                  String name = call.getString("name", "file");
                  String mime = call.getString("mime", "application/octet-stream");
                  String data = call.getString("data");
                  if (data == null) {
                      call.reject("no data");
                      return;
                  }
                  if (Build.VERSION.SDK_INT < 29) {
                      call.reject("Saving needs Android 10 or newer");
                      return;
                  }
                  try {
                      byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                      ContentResolver r = getContext().getContentResolver();
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                      v.put(MediaStore.Downloads.MIME_TYPE, mime);
                      Uri u = r.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                      if (u == null) {
                          call.reject("could not create file");
                          return;
                      }
                      try (OutputStream os = r.openOutputStream(u)) {
                          os.write(bytes);
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(e.getMessage() == null ? "save failed" : e.getMessage());
                  }
              }
          }
