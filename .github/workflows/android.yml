name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/android.yml"
      - "index.html"
      - "manifest.json"
      - "icon*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Collect web files
        run: |
          mkdir -p www
          for f in index.html manifest.json icon.svg icon-192.png icon-512.png; do
            test -f "$f" || { echo "Missing $f in the repo root"; exit 1; }
            cp "$f" www/
          done
          for f in app auth firestore; do
            curl -fsSL "https://www.gstatic.com/firebasejs/10.12.2/firebase-$f-compat.js" -o "www/firebase-$f-compat.js"
          done
          sed -i 's#https://www.gstatic.com/firebasejs/10.12.2/#./#g' www/index.html

      - name: Create Android project
        run: |
          npm init -y > /dev/null
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          if [ -f google-services.json ]; then npm install @capacitor/push-notifications@6; echo "Push notifications: ON"; else echo "Push notifications: OFF (no google-services.json in repo)"; fi
          cat > capacitor.config.json <<'CFG'
          {"appId":"com.grouphangout.app","appName":"Group Hangout","webDir":"www","backgroundColor":"#09090a","android":{"webContentsDebuggingEnabled":true}}
          CFG
          npx cap add android
          if [ -f google-services.json ]; then cp google-services.json android/app/google-services.json; fi

      - name: Add Nearby plugin and permissions
        run: |
          D=android/app/src/main/java/com/grouphangout/app
          mkdir -p "$D"
          cat > "$D/NearbyPlugin.java" <<'JAVA1'
          package com.grouphangout.app;

          import android.content.pm.PackageManager;
          import android.os.Build;
          import android.os.Handler;
          import android.os.Looper;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.JSArray;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import com.google.android.gms.common.api.ApiException;
          import com.google.android.gms.nearby.Nearby;
          import com.google.android.gms.nearby.connection.AdvertisingOptions;
          import com.google.android.gms.nearby.connection.ConnectionInfo;
          import com.google.android.gms.nearby.connection.ConnectionLifecycleCallback;
          import com.google.android.gms.nearby.connection.ConnectionResolution;
          import com.google.android.gms.nearby.connection.ConnectionsClient;
          import com.google.android.gms.nearby.connection.ConnectionsStatusCodes;
          import com.google.android.gms.nearby.connection.DiscoveredEndpointInfo;
          import com.google.android.gms.nearby.connection.DiscoveryOptions;
          import com.google.android.gms.nearby.connection.EndpointDiscoveryCallback;
          import com.google.android.gms.nearby.connection.Payload;
          import com.google.android.gms.nearby.connection.PayloadCallback;
          import com.google.android.gms.nearby.connection.PayloadTransferUpdate;
          import com.google.android.gms.nearby.connection.Strategy;
          import java.nio.charset.StandardCharsets;
          import java.util.Map;
          import java.util.Set;
          import java.util.TreeSet;
          import java.util.concurrent.ConcurrentHashMap;
          import org.json.JSONObject;

          @CapacitorPlugin(name = "Nearby")
          public class NearbyPlugin extends Plugin {
              static final String SERVICE = "com.grouphangout.app.nearby";

              private ConnectionsClient client;
              private String myName = "";
              private boolean running = false;
              private final Map<String, String> found = new ConcurrentHashMap<>();
              private final Map<String, String> connected = new ConcurrentHashMap<>();
              private final Set<String> trying = ConcurrentHashMap.newKeySet();
              private final Handler handler = new Handler(Looper.getMainLooper());
              private DiscoveryOptions dopts;

              public static String[] needed() {
                  if (Build.VERSION.SDK_INT >= 33) {
                      return new String[] {
                          "android.permission.BLUETOOTH_ADVERTISE",
                          "android.permission.BLUETOOTH_CONNECT",
                          "android.permission.BLUETOOTH_SCAN",
                          "android.permission.NEARBY_WIFI_DEVICES"
                      };
                  }
                  if (Build.VERSION.SDK_INT >= 31) {
                      return new String[] {
                          "android.permission.BLUETOOTH_ADVERTISE",
                          "android.permission.BLUETOOTH_CONNECT",
                          "android.permission.BLUETOOTH_SCAN",
                          "android.permission.ACCESS_FINE_LOCATION"
                      };
                  }
                  return new String[] { "android.permission.ACCESS_FINE_LOCATION" };
              }

              private boolean hasPerms() {
                  for (String p : needed()) {
                      if (ContextCompat.checkSelfPermission(getContext(), p) != PackageManager.PERMISSION_GRANTED) return false;
                  }
                  return true;
              }

              private final PayloadCallback payloads = new PayloadCallback() {
                  @Override
                  public void onPayloadReceived(String id, Payload p) {
                      if (p.getType() != Payload.Type.BYTES) return;
                      try {
                          JSONObject j = new JSONObject(new String(p.asBytes(), StandardCharsets.UTF_8));
                          String from = connected.get(id);
                          if (from == null) from = found.get(id);
                          JSObject o = new JSObject();
                          o.put("from", from == null ? "" : from);
                          o.put("text", j.optString("text"));
                          o.put("t", j.optLong("t", System.currentTimeMillis()));
                          notifyListeners("message", o);
                      } catch (Exception ignored) {
                      }
                  }

                  @Override
                  public void onPayloadTransferUpdate(String id, PayloadTransferUpdate u) {}
              };

              private final ConnectionLifecycleCallback lifecycle = new ConnectionLifecycleCallback() {
                  @Override
                  public void onConnectionInitiated(String id, ConnectionInfo info) {
                      found.put(id, info.getEndpointName());
                      client.acceptConnection(id, payloads);
                  }

                  @Override
                  public void onConnectionResult(String id, ConnectionResolution r) {
                      trying.remove(id);
                      String n = found.get(id);
                      if (r.getStatus().getStatusCode() == ConnectionsStatusCodes.STATUS_OK && n != null) {
                          connected.put(id, n);
                      } else {
                          rediscover();
                      }
                      emitPeers();
                  }

                  @Override
                  public void onDisconnected(String id) {
                      connected.remove(id);
                      trying.remove(id);
                      emitPeers();
                      rediscover();
                  }
              };

              private final EndpointDiscoveryCallback discovery = new EndpointDiscoveryCallback() {
                  @Override
                  public void onEndpointFound(String id, DiscoveredEndpointInfo info) {
                      String n = info.getEndpointName();
                      found.put(id, n);
                      if (connected.containsKey(id) || trying.contains(id) || connected.containsValue(n)) return;
                      if (myName.compareTo(n) <= 0) {
                          trying.add(id);
                          client.requestConnection(myName, id, lifecycle).addOnFailureListener(e -> trying.remove(id));
                      }
                  }

                  @Override
                  public void onEndpointLost(String id) {
                      trying.remove(id);
                  }
              };

              private void rediscover() {
                  if (!running || client == null || dopts == null) return;
                  handler.postDelayed(() -> {
                      if (!running || client == null) return;
                      client.stopDiscovery();
                      client.startDiscovery(SERVICE, discovery, dopts);
                  }, 1500);
              }

              private void emitPeers() {
                  Set<String> names = new TreeSet<>(connected.values());
                  JSArray a = new JSArray();
                  for (String n : names) a.put(n);
                  JSObject o = new JSObject();
                  o.put("peers", a);
                  notifyListeners("peers", o);
              }

              private void fail(PluginCall call, Exception e) {
                  if (e instanceof ApiException) {
                      int c = ((ApiException) e).getStatusCode();
                      if (c == ConnectionsStatusCodes.STATUS_ALREADY_ADVERTISING || c == ConnectionsStatusCodes.STATUS_ALREADY_DISCOVERING) {
                          running = true;
                          call.resolve();
                          return;
                      }
                  }
                  call.reject(e.getMessage() == null ? "nearby failed" : e.getMessage());
              }

              @PluginMethod
              public void start(PluginCall call) {
                  String name = call.getString("name");
                  if (name == null || name.isEmpty()) {
                      call.reject("name");
                      return;
                  }
                  if (!hasPerms()) {
                      if (getActivity() != null) ActivityCompat.requestPermissions(getActivity(), needed(), 7);
                      call.reject("permissions");
                      return;
                  }
                  if (running) {
                      call.resolve();
                      return;
                  }
                  myName = name;
                  client = Nearby.getConnectionsClient(getContext());
                  AdvertisingOptions ao = new AdvertisingOptions.Builder().setStrategy(Strategy.P2P_CLUSTER).build();
                  dopts = new DiscoveryOptions.Builder().setStrategy(Strategy.P2P_CLUSTER).build();
                  client
                      .startAdvertising(myName, SERVICE, lifecycle, ao)
                      .addOnSuccessListener(u ->
                          client
                              .startDiscovery(SERVICE, discovery, dopts)
                              .addOnSuccessListener(v -> {
                                  running = true;
                                  call.resolve();
                              })
                              .addOnFailureListener(e -> fail(call, e))
                      )
                      .addOnFailureListener(e -> fail(call, e));
              }

              @PluginMethod
              public void send(PluginCall call) {
                  String to = call.getString("to");
                  String text = call.getString("text");
                  if (!running || to == null || text == null) {
                      call.reject("not ready");
                      return;
                  }
                  try {
                      JSONObject j = new JSONObject();
                      j.put("text", text);
                      j.put("t", System.currentTimeMillis());
                      byte[] b = j.toString().getBytes(StandardCharsets.UTF_8);
                      int n = 0;
                      for (Map.Entry<String, String> en : connected.entrySet()) {
                          if (to.equals(en.getValue())) {
                              client.sendPayload(en.getKey(), Payload.fromBytes(b));
                              n++;
                          }
                      }
                      if (n == 0) {
                          call.reject("not nearby");
                          return;
                      }
                      call.resolve();
                  } catch (Exception ex) {
                      call.reject("send failed");
                  }
              }

              private void halt() {
                  if (client != null) {
                      client.stopAdvertising();
                      client.stopDiscovery();
                      client.stopAllEndpoints();
                  }
                  running = false;
                  handler.removeCallbacksAndMessages(null);
                  connected.clear();
                  found.clear();
                  trying.clear();
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  halt();
                  call.resolve();
              }

              @Override
              protected void handleOnDestroy() {
                  halt();
              }
          }
          JAVA1
          cat > "$D/CallService.java" <<'JAVA3'
          package com.grouphangout.app;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.Service;
          import android.content.Context;
          import android.content.Intent;
          import android.content.pm.ServiceInfo;
          import android.os.Build;
          import android.os.IBinder;
          import android.os.PowerManager;
          import androidx.core.app.NotificationCompat;

          public class CallService extends Service {
              static final String CH = "ongoing_call";
              private PowerManager.WakeLock lock;

              @Override
              public IBinder onBind(Intent i) {
                  return null;
              }

              @Override
              public int onStartCommand(Intent intent, int flags, int startId) {
                  String title = "Voice call";
                  if (intent != null && intent.getStringExtra("title") != null) title = intent.getStringExtra("title");
                  NotificationManager nm = (NotificationManager) getSystemService(Context.NOTIFICATION_SERVICE);
                  if (Build.VERSION.SDK_INT >= 26) {
                      nm.createNotificationChannel(new NotificationChannel(CH, "Ongoing call", NotificationManager.IMPORTANCE_LOW));
                  }
                  Intent open = new Intent(this, MainActivity.class);
                  open.setFlags(Intent.FLAG_ACTIVITY_SINGLE_TOP | Intent.FLAG_ACTIVITY_CLEAR_TOP);
                  PendingIntent pi = PendingIntent.getActivity(this, 0, open, PendingIntent.FLAG_IMMUTABLE);
                  Notification n = new NotificationCompat.Builder(this, CH)
                      .setSmallIcon(android.R.drawable.stat_sys_phone_call)
                      .setContentTitle("In a call")
                      .setContentText(title)
                      .setOngoing(true)
                      .setContentIntent(pi)
                      .setCategory(NotificationCompat.CATEGORY_CALL)
                      .build();
                  if (Build.VERSION.SDK_INT >= 30) {
                      startForeground(4242, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MICROPHONE);
                  } else {
                      startForeground(4242, n);
                  }
                  if (lock == null) {
                      PowerManager pm = (PowerManager) getSystemService(Context.POWER_SERVICE);
                      lock = pm.newWakeLock(PowerManager.PARTIAL_WAKE_LOCK, "grouphangout:call");
                      lock.acquire(4 * 60 * 60 * 1000L);
                  }
                  return START_NOT_STICKY;
              }

              @Override
              public void onDestroy() {
                  if (lock != null && lock.isHeld()) lock.release();
                  lock = null;
                  super.onDestroy();
              }
          }
          JAVA3
          cat > "$D/CallKeepPlugin.java" <<'JAVA4'
          package com.grouphangout.app;

          import android.content.Intent;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "CallKeep")
          public class CallKeepPlugin extends Plugin {
              @PluginMethod
              public void start(PluginCall call) {
                  try {
                      Intent i = new Intent(getContext(), CallService.class);
                      i.putExtra("title", call.getString("title", "Voice call"));
                      ContextCompat.startForegroundService(getContext(), i);
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(e.getMessage() == null ? "failed" : e.getMessage());
                  }
              }

              @PluginMethod
              public void stop(PluginCall call) {
                  getContext().stopService(new Intent(getContext(), CallService.class));
                  call.resolve();
              }
          }
          JAVA4
          cat > "$D/FilesPlugin.java" <<'JAVA5'
          package com.grouphangout.app;

          import android.content.ContentResolver;
          import android.content.ContentValues;
          import android.net.Uri;
          import android.os.Build;
          import android.provider.MediaStore;
          import android.util.Base64;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;
          import java.io.OutputStream;

          @CapacitorPlugin(name = "Files")
          public class FilesPlugin extends Plugin {
              @PluginMethod
              public void save(PluginCall call) {
                  String name = call.getString("name", "file");
                  String mime = call.getString("mime", "application/octet-stream");
                  String data = call.getString("data");
                  if (data == null) {
                      call.reject("no data");
                      return;
                  }
                  if (Build.VERSION.SDK_INT < 29) {
                      call.reject("Saving needs Android 10 or newer");
                      return;
                  }
                  try {
                      byte[] bytes = Base64.decode(data, Base64.DEFAULT);
                      ContentResolver r = getContext().getContentResolver();
                      ContentValues v = new ContentValues();
                      v.put(MediaStore.Downloads.DISPLAY_NAME, name);
                      v.put(MediaStore.Downloads.MIME_TYPE, mime);
                      Uri u = r.insert(MediaStore.Downloads.EXTERNAL_CONTENT_URI, v);
                      if (u == null) {
                          call.reject("could not create file");
                          return;
                      }
                      try (OutputStream os = r.openOutputStream(u)) {
                          os.write(bytes);
                      }
                      call.resolve();
                  } catch (Exception e) {
                      call.reject(e.getMessage() == null ? "save failed" : e.getMessage());
                  }
              }
          }
          JAVA5
          cat > "$D/MainActivity.java" <<'JAVA2'
          package com.grouphangout.app;

          import android.content.pm.PackageManager;
          import android.os.Bundle;
          import androidx.core.app.ActivityCompat;
          import androidx.core.content.ContextCompat;
          import com.getcapacitor.BridgeActivity;
          import java.util.ArrayList;
          import java.util.List;

          public class MainActivity extends BridgeActivity {
              @Override
              public void onCreate(Bundle savedInstanceState) {
                  registerPlugin(NearbyPlugin.class);
                  registerPlugin(CallKeepPlugin.class);
                  registerPlugin(FilesPlugin.class);
                  super.onCreate(savedInstanceState);
                  List<String> need = new ArrayList<>();
                  for (String p : NearbyPlugin.needed()) {
                      if (ContextCompat.checkSelfPermission(this, p) != PackageManager.PERMISSION_GRANTED) need.add(p);
                  }
                  if (android.os.Build.VERSION.SDK_INT >= 33 && ContextCompat.checkSelfPermission(this, "android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                      need.add("android.permission.POST_NOTIFICATIONS");
                  }
                  if (!need.isEmpty()) {
                      ActivityCompat.requestPermissions(this, need.toArray(new String[0]), 7);
                  }
              }
          }
          JAVA2
          cat > patch_android.py <<'PY'
          import re, pathlib

          # 1) manifest permissions
          mp = pathlib.Path("android/app/src/main/AndroidManifest.xml")
          m = mp.read_text()
          perms = """    <uses-permission android:name="android.permission.ACCESS_WIFI_STATE" />
              <uses-permission android:name="android.permission.CHANGE_WIFI_STATE" />
              <uses-permission android:name="android.permission.BLUETOOTH" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADMIN" android:maxSdkVersion="30" />
              <uses-permission android:name="android.permission.ACCESS_COARSE_LOCATION" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.ACCESS_FINE_LOCATION" android:maxSdkVersion="32" />
              <uses-permission android:name="android.permission.BLUETOOTH_ADVERTISE" />
              <uses-permission android:name="android.permission.BLUETOOTH_CONNECT" />
              <uses-permission android:name="android.permission.BLUETOOTH_SCAN" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.NEARBY_WIFI_DEVICES" android:usesPermissionFlags="neverForLocation" />
              <uses-permission android:name="android.permission.RECORD_AUDIO" />
              <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />
              <uses-permission android:name="android.permission.VIBRATE" />
              <uses-permission android:name="android.permission.WAKE_LOCK" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE" />
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MICROPHONE" />
          """
          assert "<application" in m
          if "BLUETOOTH_SCAN" not in m:
              m = m.replace("<application", perms + "\n    <application", 1)
          if "CallService" not in m:
              m = m.replace("</application>", '    <service android:name=".CallService" android:foregroundServiceType="microphone" android:exported="false" />\n    </application>', 1)
          mp.write_text(m)

          # 2) min SDK 23 (Nearby)
          vp = pathlib.Path("android/variables.gradle")
          v = vp.read_text()
          v = re.sub(r"minSdkVersion\s*=\s*\d+", "minSdkVersion = 23", v)
          vp.write_text(v)

          # 3) Nearby dependency
          gp = pathlib.Path("android/app/build.gradle")
          g = gp.read_text()
          if "play-services-nearby" not in g:
              g = re.sub(r"(\ndependencies \{\n)", r'\1    implementation "com.google.android.gms:play-services-nearby:19.1.0"\n', g, count=1)
              assert "play-services-nearby" in g
          gp.write_text(g)
          print("patched")
          PY
          python3 patch_android.py
          npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: GroupHangout-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk GroupHangout.apk
          gh release create "apk-${{ github.run_number }}" GroupHangout.apk --target "${{ github.sha }}" --title "Group Hangout APK ${{ github.run_number }}" --notes "Install this APK on an Android phone."
