          cat > "$D/ShareInPlugin.java" <<'JAVA6'
          package com.grouphangout.app;

          import android.content.Intent;
          import com.getcapacitor.Bridge;
          import com.getcapacitor.JSObject;
          import com.getcapacitor.Plugin;
          import com.getcapacitor.PluginCall;
          import com.getcapacitor.PluginHandle;
          import com.getcapacitor.PluginMethod;
          import com.getcapacitor.annotation.CapacitorPlugin;

          @CapacitorPlugin(name = "ShareIn")
          public class ShareInPlugin extends Plugin {
              private static String pending = null;

              public static void take(Intent i) {
                  if (i == null || !Intent.ACTION_SEND.equals(i.getAction())) return;
                  String t = i.getStringExtra(Intent.EXTRA_TEXT);
                  String s = i.getStringExtra(Intent.EXTRA_SUBJECT);
                  if (t == null || t.trim().isEmpty()) t = s;
                  if (t == null || t.trim().isEmpty()) return;
                  if (s != null && !s.trim().isEmpty() && !t.contains(s)) t = s + "\n" + t;
                  pending = t.trim();
                  i.removeExtra(Intent.EXTRA_TEXT);
                  i.removeExtra(Intent.EXTRA_SUBJECT);
              }

              public static void fire(Bridge b) {
                  if (b == null) return;
                  PluginHandle ph = b.getPlugin("ShareIn");
                  if (ph != null && ph.getInstance() instanceof ShareInPlugin) {
                      ((ShareInPlugin) ph.getInstance()).notifyListeners("shared", new JSObject());
                  }
              }

              @PluginMethod
              public void getShared(PluginCall call) {
                  JSObject o = new JSObject();
                  if (pending != null) {
                      o.put("text", pending);
                      pending = null;
                  }
                  call.resolve(o);
              }
          }
